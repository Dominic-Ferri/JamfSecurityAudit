<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JamfSecurityAudit · Codebase graph</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101824;color:#edf2f8;font:16px system-ui}header{padding:24px 32px;border-bottom:1px solid #344459}h1{margin:0 0 8px;font-size:26px}p{line-height:1.6;color:#b9c9da}input,button,select{font:inherit;color:inherit;background:#233348;border:1px solid #566c86;border-radius:6px;padding:9px;margin:4px}main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:24px}svg{width:100%;height:auto;background:#162234;border-radius:12px}aside{overflow-wrap:anywhere}button{cursor:pointer}button:hover,button:focus-visible{background:#3d5676}.node{cursor:pointer}.node:focus rect,.node:hover rect{stroke:white;stroke-width:3}.edge{stroke:#536b86;stroke-width:1.3;opacity:.35}.muted{opacity:.12}.active{stroke:#ffcc66!important;stroke-width:3;opacity:1}a{color:#8dd8ff}.small{font-size:13px}#relations button{display:block;text-align:left;width:100%;font-size:13px}@media(max-width:850px){main{grid-template-columns:1fr}header{padding:20px}aside{padding:8px}}
</style>
<header><h1>JamfSecurityAudit</h1><p>Explore the codebase · Understand Anything graph</p><label>Find a node <input id="search" type="search" placeholder="Name, file, or description"></label><button id="reset">Reset view</button><label>Guided tour <select id="tour"><option value="">Choose a step</option></select></label><div id="stats" class="small"></div></header>
<main><section aria-label="Interactive codebase graph"><svg id="graph" viewBox="0 0 1000 1080" role="img" aria-label="Codebase nodes and directed relationships"></svg></section><aside aria-live="polite"><h2 id="heading">Select a node</h2><p id="description">Click a component to see its description and connected components.</p><p id="file" class="small"></p><div id="relations"></div><p class="small">Source snapshot: <span id="revision"></span>. This is a static architecture snapshot, not a live security audit.</p></aside></main>
<script id="data" type="application/json">__GRAPH_JSON__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),svg=document.getElementById('graph'),ns='http://www.w3.org/2000/svg';
const el=(tag,attrs={},text)=>{const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e};
const colors=['#7dcfff','#a7df9a','#ffcc80','#c8a9ff'],positions=new Map(),groups=new Map(),lines=[];
data.nodes.forEach((n,i)=>{const col=i%3,row=Math.floor(i/3);positions.set(n.id,{x:30+col*330,y:45+row*128});});
const defs=el('defs'),marker=el('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:5,markerHeight:5,orient:'auto'});marker.append(el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#9eb4cc'}));defs.append(marker);svg.append(defs);
data.edges.forEach(e=>{const a=positions.get(e.source),b=positions.get(e.target);const line=el('path',{d:`M ${a.x+145} ${a.y+58} Q ${(a.x+b.x)/2+145+35} ${(a.y+b.y)/2+29} ${b.x+145} ${b.y}`,fill:'none',class:'edge','marker-end':'url(#arrow)'});line.append(el('title',{},`${e.source} → ${e.type} → ${e.target}`));svg.append(line);lines.push({e,line});});
data.nodes.forEach((n,i)=>{const p=positions.get(n.id),g=el('g',{class:'node',tabindex:0,role:'button','aria-label':n.name,transform:`translate(${p.x},${p.y})`});g.append(el('rect',{width:290,height:76,rx:9,fill:'#203249',stroke:colors[i%4]}));const label=n.name.length>33?n.name.slice(0,30)+'…':n.name;g.append(el('text',{x:12,y:28,fill:'#f1f6fc','font-size':14},label));g.append(el('text',{x:12,y:53,fill:'#adbed2','font-size':12},n.type));g.append(el('title',{},n.name));g.onclick=()=>select(n.id);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n.id)}};svg.append(g);groups.set(n.id,g);});
function focus(ids){const set=new Set(ids);for(const[id,g]of groups)g.classList.toggle('muted',!set.has(id));for(const{e,line}of lines){const on=set.has(e.source)&&set.has(e.target);line.classList.toggle('active',on);line.classList.toggle('muted',!on)}}
function select(id){const n=data.nodes.find(n=>n.id===id),edges=data.edges.filter(e=>e.source===id||e.target===id);focus([id,...edges.flatMap(e=>[e.source,e.target])]);document.getElementById('heading').textContent=n.name;document.getElementById('description').textContent=n.summary;document.getElementById('file').textContent=n.filePath||'';const list=document.getElementById('relations');list.replaceChildren();for(const e of edges){const other=e.source===id?e.target:e.source,b=document.createElement('button');b.textContent=`${e.source===id?'→':'←'} ${e.type}: ${data.nodes.find(n=>n.id===other).name}`;b.onclick=()=>select(other);list.append(b)}}
document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();focus(data.nodes.filter(n=>`${n.name} ${n.filePath} ${n.summary}`.toLowerCase().includes(q)).map(n=>n.id))};
document.getElementById('reset').onclick=()=>{document.getElementById('search').value='';document.getElementById('tour').value='';for(const g of groups.values())g.classList.remove('muted');for(const{line}of lines)line.classList.remove('active','muted')};
const tour=document.getElementById('tour');data.tour.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${s.order}. ${s.title}`;tour.append(o)});tour.onchange=()=>{if(tour.value==='')return;const s=data.tour[Number(tour.value)];focus(s.nodeIds);document.getElementById('heading').textContent=s.title;document.getElementById('description').textContent=s.description;document.getElementById('file').textContent='';document.getElementById('relations').replaceChildren()};
document.getElementById('stats').textContent=`${data.nodes.length} nodes · ${data.edges.length} relationships · ${data.layers.length} layers · ${data.tour.length} tour steps`;
document.getElementById('revision').textContent=data.project.gitCommitHash.slice(0,7);
</script></html>
